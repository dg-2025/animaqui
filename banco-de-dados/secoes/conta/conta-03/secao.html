        <div class="cartoes">
          <form class="cartao formPerfil" action="#" novalidate data-anima>
            <h3 class="cartaoTitulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Informações pessoais</h3>
            <p class="mensagem" role="status" hidden></p>
            <label class="campo">
              <span class="rotulo">Nome completo</span>
              <input name="nome" value="Marina Duarte" placeholder="Seu nome completo" autocomplete="name">
            </label>
            <label class="campo">
              <span class="rotulo">E-mail</span>
              <input name="email" type="email" value="marina.duarte@email.com" disabled>
              <small>O e-mail não pode ser alterado</small>
            </label>
            <label class="campo">
              <span class="rotulo">Celular</span>
              <input name="celular" inputmode="numeric" value="(11) 98765-4321" placeholder="(00) 00000-0000" autocomplete="tel">
            </label>
            <button class="botaoSalvar" type="submit">Salvar alterações</button>
          </form>

          <form class="cartao formSenha" action="#" novalidate data-anima>
            <h3 class="cartaoTitulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Alterar senha</h3>
            <p class="mensagem" role="status" hidden></p>
            <label class="campo">
              <span class="rotulo">Senha atual</span>
              <input name="atual" type="password" placeholder="Digite sua senha atual" autocomplete="current-password">
            </label>
            <label class="campo">
              <span class="rotulo">Nova senha</span>
              <input name="nova" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
              <span class="forca" aria-hidden="true"><span class="forcaBarra"></span></span>
            </label>
            <label class="campo">
              <span class="rotulo">Confirmar nova senha</span>
              <input name="confirmar" type="password" placeholder="Digite novamente a nova senha" autocomplete="new-password">
            </label>
            <button class="botaoSenha" type="submit">Alterar senha</button>
          </form>
        </div>
      </div>
    </div>

    <div class="vistaEntrar" hidden>
      <form class="cartaoEntrar" action="#" novalidate>
        <h2 class="tituloEntrar">Entrar</h2>
        <p class="subtituloEntrar">Acesse para acompanhar pedidos e favoritos.</p>
        <p class="alertaErro" role="alert" hidden></p>
        <label class="campo campoNome" hidden>
          <span class="rotulo">Nome completo</span>
          <input name="nome" placeholder="Como quer ser chamado" autocomplete="name">
        </label>
        <label class="campo">
          <span class="rotulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg> E-mail</span>
          <input name="email" type="email" placeholder="seu@email.com" autocomplete="email">
        </label>
        <label class="campo">
          <span class="rotulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Senha</span>
          <input name="senha" type="password" placeholder="Sua senha" autocomplete="current-password">
        </label>
        <button class="botaoEntrar" type="submit">Entrar</button>
        <p class="rodapeEntrar"><span class="perguntaTroca">Ainda não tem conta?</span> <button class="trocarModo" type="button">Criar conta</button></p>
