<section class="servicos02">
  <div class="interno">
    <header class="cabecalho" data-anima>
      <p class="etiqueta">Nosso método</p>
      <h2 class="titulo">Um caminho claro para o seu negócio <span class="destaque">crescer todo mês</span></h2>
      <p class="subtitulo">Siga o passo a passo e veja cada etapa <strong>trabalhando a favor do resultado</strong>.</p>
    </header>

    <div class="diagrama" data-anima>
      <div class="coluna colunaEsquerda">
        <button type="button" class="ponto" data-etapa="atracao" aria-hidden="true" tabindex="-1">
          <span class="rotulo">Atração</span><span class="traco"></span><span class="bolinha"></span>
        </button>
        <button type="button" class="ponto" data-etapa="retorno" aria-hidden="true" tabindex="-1">
          <span class="rotulo">Retorno</span><span class="traco"></span><span class="bolinha"></span>
        </button>
      </div>

      <div class="centro" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 21 8v8l-9 5-9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
        <span class="nomeMarca">Sua marca</span>
      </div>

      <div class="coluna colunaDireita">
        <button type="button" class="ponto" data-etapa="retencao" aria-hidden="true" tabindex="-1">
          <span class="bolinha"></span><span class="traco"></span><span class="rotulo">Retenção</span>
        </button>
        <button type="button" class="ponto ativo" data-etapa="captacao" aria-hidden="true" tabindex="-1">
          <span class="bolinha"></span><span class="traco"></span><span class="rotulo">Captação</span>
        </button>
        <button type="button" class="ponto" data-etapa="fechamento" aria-hidden="true" tabindex="-1">
          <span class="bolinha"></span><span class="traco"></span><span class="rotulo">Fechamento</span>
        </button>
      </div>
    </div>

    <div class="botoes" data-anima>
      <button type="button" class="botao" data-etapa="atracao" aria-pressed="false" data-texto="Materiais e mensagens que prendem a atenção do público certo logo no primeiro contato.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 19.1a10 10 0 0 1 0-14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>
        <span>Atração</span>
      </button>
      <button type="button" class="botao ativo" data-etapa="captacao" aria-pressed="true" data-texto="Ações pagas e orgânicas ajustadas para trazer quem realmente tem perfil de compra.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>
        <span>Captação</span>
      </button>
      <button type="button" class="botao" data-etapa="fechamento" aria-pressed="false" data-texto="Ofertas e atendimento organizados para aumentar o valor de cada venda já na primeira compra.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7s7 6.3 7 11.3a7 7 0 0 1-14 0c0-5 7-11.3 7-11.3z"/></svg>
        <span>Fechamento</span>
      </button>
      <button type="button" class="botao" data-etapa="retencao" aria-pressed="false" data-texto="Compras contínuas com custo menor: seus clientes seguem ativos e fiéis.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>
        <span>Retenção</span>
      </button>
      <button type="button" class="botao" data-etapa="retorno" aria-pressed="false" data-texto="Recuperamos quem parou de comprar e aceleramos as vendas nos dias mais fracos.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
        <span>Retorno</span>
      </button>
    </div>

    <div class="caixa" data-anima>
      <span class="seta" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
      <p class="descricao" aria-live="polite">Ações pagas e orgânicas ajustadas para trazer quem realmente tem perfil de compra.</p>
    </div>
  </div>
</section>
